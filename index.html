<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CodexとClaudeのスキル構成と環境差分を確認する一覧ページ">
  <title>SkillDeck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Old+Mincho:wght@500;600&family=JetBrains+Mono:wght@500&display=swap">
  <style>
    :root { color-scheme:light dark; --bg:#f8f6f5; --surface:#fff; --surface-quiet:#f5f1ef; --line:#ded7d3; --text:#281f1d; --muted:#625956; --subtle:#7a6f6b; --accent:#8c2f3a; --accent-deep:#6d1f28; --accent-soft:#f8e9eb; --ok:#205d48; --ok-bg:#e8f4ee; --warn:#8a5310; --warn-bg:#fff2d9; --only:#405b8c; --only-bg:#eaf0fb; --shadow:0 1px 2px rgb(54 30 26 / 7%),0 8px 24px rgb(54 30 26 / 5%); }
    @media (prefers-color-scheme:dark) { :root { --bg:#181313; --surface:#211a19; --surface-quiet:#29201f; --line:#4a3b38; --text:#f3e9e5; --muted:#c8bbb6; --subtle:#aa9b96; --accent:#f1a1aa; --accent-deep:#ffd3d7; --accent-soft:#44252a; --ok:#9dd7bc; --ok-bg:#173a2c; --warn:#f0c47f; --warn-bg:#4a3317; --only:#b8cdf9; --only-bg:#273756; --shadow:0 2px 12px rgb(0 0 0 / 22%); } }
    * { box-sizing:border-box; } [hidden] { display:none !important; } body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans JP",system-ui,sans-serif; font-size:15px; line-height:1.65; overflow-x:clip; } button,input,select { font:inherit; } button { cursor:pointer; } button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    .wrap { max-width:1380px; margin:0 auto; padding:0 28px 64px; } .top { display:flex; justify-content:space-between; gap:24px; align-items:flex-end; border-bottom:1px solid var(--line); padding:28px 0 0; } .brand { min-width:220px; } h1 { font-family:"Zen Old Mincho",serif; font-size:30px; line-height:1.2; margin:0; font-weight:600; letter-spacing:.02em; } .sub { color:var(--muted); font-size:13px; margin:6px 0 16px; }
    .tabs { display:flex; gap:20px; align-items:flex-end; } .tab { appearance:none; border:0; border-bottom:3px solid transparent; background:transparent; color:var(--muted); padding:9px 2px 13px; font-weight:600; } .tab[aria-selected="true"] { border-color:var(--accent); color:var(--text); } .tab-count { color:var(--accent); font-family:"JetBrains Mono",monospace; font-size:12px; margin-left:4px; }
    .environment-row { display:flex; align-items:center; gap:8px; padding:16px 0; flex-wrap:wrap; } .environment-row strong { font-size:13px; color:var(--muted); margin-right:2px; } .env-toggle,.filter-button { border:1px solid var(--line); background:var(--surface); color:var(--muted); border-radius:999px; padding:5px 11px; font-size:13px; } .env-toggle[aria-pressed="true"] { color:var(--accent-deep); border-color:var(--accent); background:var(--accent-soft); font-weight:700; }
    .screen { display:none; } .screen.active { display:block; } .filters { display:grid; grid-template-columns:minmax(220px,1fr) 190px 190px; gap:10px; margin-bottom:18px; } .input,.select { width:100%; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--text); padding:10px 12px; min-height:44px; }
    .layout { display:grid; grid-template-columns:250px minmax(0,1fr); gap:24px; align-items:start; } .panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:15px; } .panel + .panel { margin-top:14px; } .panel-title { color:var(--subtle); font-size:12px; font-weight:700; letter-spacing:.05em; margin:0 0 8px; } .category-list { display:grid; gap:3px; }
    .category-button { width:100%; display:flex; justify-content:space-between; align-items:center; border:0; border-radius:8px; background:transparent; color:var(--muted); text-align:left; padding:8px 9px; } .category-button:hover { background:var(--surface-quiet); } .category-button[aria-pressed="true"] { background:var(--accent); color:#fff; font-weight:700; } .category-button small { font-family:"JetBrains Mono",monospace; font-size:11px; } .status-note { color:var(--muted); font-size:12px; margin:0; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; gap:12px; min-height:36px; margin-bottom:12px; flex-wrap:wrap; } .count { color:var(--muted); font-size:13px; } .count b { color:var(--text); font-family:"JetBrains Mono",monospace; } .active-filter { color:var(--accent-deep); background:var(--accent-soft); border-radius:999px; padding:4px 10px; font-size:12px; } .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:14px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; min-width:0; } .card-top,.badge-row,.card-footer,.card-flags { display:flex; gap:7px; align-items:center; flex-wrap:wrap; } .card-top { justify-content:space-between; } .kind,.tag,.status,.origin { border-radius:999px; padding:2px 8px; font-size:11px; font-weight:700; } .kind { background:var(--surface-quiet); color:var(--muted); border:1px solid var(--line); } .tag { background:var(--surface-quiet); color:var(--muted); } .origin { display:inline-flex; align-items:center; gap:5px; border:1px solid transparent; } .origin::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; } .origin-self { color:#7d3358; background:#f8eaf1; border-color:#efd1df; } .origin-official { color:#216152; background:#eaf6f0; border-color:#cde8da; } .origin-external { color:#49608e; background:#edf1fb; border-color:#d5def3; } .status.synced { color:var(--ok); background:var(--ok-bg); } .status.codex_only,.status.claude_only { color:var(--only); background:var(--only-bg); } .status.not_mirrorable,.status.needs_review { color:var(--warn); background:var(--warn-bg); }
    h2.card-name { font-family:"Zen Old Mincho",serif; font-size:18px; line-height:1.42; margin:0; } .description { color:var(--muted); font-size:13px; margin:0; flex:1; } .example { background:var(--surface-quiet); border-radius:9px; padding:9px 10px; display:grid; grid-template-columns:1fr auto; gap:8px; align-items:start; } .example-label { display:block; font-size:10px; color:var(--subtle); margin-bottom:2px; } .example-text { margin:0; font-size:12.5px; line-height:1.5; } .copy { border:1px solid var(--line); background:var(--surface); color:var(--muted); padding:4px 8px; border-radius:6px; font-size:11px; font-weight:700; } .copy:hover { color:var(--accent); border-color:var(--accent); }
    .card-footer { justify-content:space-between; color:var(--subtle); font-size:11.5px; } details { border-top:1px solid var(--line); padding-top:8px; } summary { color:var(--muted); font-size:12px; cursor:pointer; } dl { display:grid; grid-template-columns:92px 1fr; gap:7px 10px; font-size:12px; margin:10px 0 0; } dt { color:var(--subtle); } dd { margin:0; overflow-wrap:anywhere; } code { font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--accent-deep); }
    .empty,.loading { border:1px dashed var(--line); border-radius:12px; color:var(--muted); padding:42px 20px; text-align:center; } .difference-head { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; margin:4px 0 18px; } .difference-head h2 { margin:0; font-family:"Zen Old Mincho",serif; font-size:22px; } .date { color:var(--muted); font-size:12px; } .stat-grid { display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); gap:10px; margin-bottom:22px; } .stat { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px; box-shadow:var(--shadow); } .stat b { display:block; font-family:"JetBrains Mono",monospace; font-size:23px; line-height:1.1; margin-top:2px; } .stat span { color:var(--muted); font-size:12px; }
    .difference-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; } .difference-grid > .panel,.diff-list,.diff-item { min-width:0; } .diff-list { display:grid; gap:7px; max-height:330px; overflow:auto; } .diff-item { border:1px solid var(--line); border-radius:8px; padding:8px 9px; font-size:12px; overflow-wrap:anywhere; } .diff-item b { display:block; font-size:12.5px; } .diff-item span { color:var(--muted); display:block; overflow-wrap:anywhere; } .duplicate-candidate + .duplicate-candidate { border-top:1px solid var(--line); margin-top:7px; padding-top:7px; } .identity-label { color:var(--subtle); } .footnote { border-top:1px solid var(--line); color:var(--subtle); font-size:12px; margin-top:28px; padding-top:14px; } .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:880px) { .filters { grid-template-columns:1fr 1fr; } .filters input { grid-column:1/-1; } .layout { grid-template-columns:1fr; } .category-list { grid-template-columns:repeat(2,minmax(0,1fr)); } .difference-grid { grid-template-columns:1fr; } .stat-grid { grid-template-columns:repeat(3,1fr); } }
    @media (max-width:560px) { body { font-size:16px; } .wrap { padding:0 16px 38px; } .top { padding-top:20px; align-items:flex-start; flex-direction:column; gap:4px; } .tabs { gap:16px; } .filters { grid-template-columns:1fr; } .filters input { grid-column:auto; } .category-list { grid-template-columns:1fr; } .grid { grid-template-columns:1fr; } .stat-grid { grid-template-columns:repeat(2,1fr); } .environment-row { padding:12px 0; } h1 { font-size:28px; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand"><h1>SkillDeck</h1><p class="sub">CodexとClaudeのスキル構成を、用途と環境差分から確認する。</p></div>
      <nav class="tabs" aria-label="画面切り替え" role="tablist">
        <button class="tab" id="skillsTab" role="tab" aria-selected="true" aria-controls="skillsScreen">スキル一覧 <span class="tab-count" id="tabCount">–</span></button>
        <button class="tab" id="diffTab" role="tab" aria-selected="false" aria-controls="diffScreen">環境差分</button>
      </nav>
    </header>
    <main>
      <section class="screen active" id="skillsScreen" role="tabpanel" aria-labelledby="skillsTab">
        <div class="environment-row" id="environmentControls" aria-label="利用環境で絞り込む"><strong>利用環境</strong><button class="env-toggle" type="button" data-env="codex" aria-pressed="false">Codex</button><button class="env-toggle" type="button" data-env="claude" aria-pressed="false">Claude</button><span class="status-note">未選択: 全件 / 両方: 両環境で導入・設定の証跡がある項目</span></div>
        <div class="filters" aria-label="スキル一覧の絞り込み">
          <label><span class="sr-only">キーワード検索</span><input class="input" id="search" type="search" placeholder="検索: 議事録、スライド、広告など"></label>
          <label><span class="sr-only">案件タグ</span><select class="select" id="projectFilter"><option value="">案件タグ: すべて</option></select></label>
          <label><span class="sr-only">由来</span><select class="select" id="providerFilter"><option value="">由来: すべて</option></select></label>
        </div>
        <div class="layout">
          <aside>
            <section class="panel" aria-labelledby="categoryHeading"><h2 class="panel-title" id="categoryHeading">カテゴリ</h2><div class="category-list" id="categoryList"></div></section>
            <section class="panel" aria-labelledby="statusHeading"><h2 class="panel-title" id="statusHeading">同期状態について</h2><p class="status-note">環境の絞り込みとは別に、各カードで同期済み・Codexのみ・Claudeのみ・ミラー不可・要確認を示します。</p></section>
          </aside>
          <section aria-live="polite"><div class="toolbar"><div class="count"><b id="resultCount">–</b> 件を表示中</div><div id="activeFilter" class="active-filter" hidden></div></div><div class="grid" id="cardGrid"><div class="loading">棚卸しデータを読み込んでいます。</div></div></section>
        </div>
      </section>
      <section class="screen" id="diffScreen" role="tabpanel" aria-labelledby="diffTab">
        <div class="difference-head"><div><h2>環境差分</h2><p class="status-note">数値は棚卸しデータから実行時に計算しています。</p></div><div class="date" id="generatedAt">–</div></div>
        <div class="stat-grid" id="statGrid"></div><div class="difference-grid" id="differenceGrid"></div>
      </section>
    </main>
    <footer class="footnote">公開用データには認証情報、絶対パス、接続ID、会話履歴を含めません。Plugin cacheの物理ファイル数は利用可能なSkill数として数えません。</footer>
  </div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>
  <script type="module">
    const state = { view:'skills', envs:new Set(), query:'', category:'', project:'', provider:'' };
    const statusLabel = { synced:'同期済み', codex_only:'Codexのみ', claude_only:'Claudeのみ', not_mirrorable:'ミラー不可', needs_review:'要確認' };
    const availabilityLabel = { verified:'確認済み', installed_unverified:'導入済み・実行要確認', not_distributed:'未配布', 'not-applicable':'対象外' };
    const portabilityLabel = { directly_shareable:'直接共有可', adapter_required:'変換・接続が必要', functionally_recreatable:'機能再現可', mirror_impossible:'ミラー不可', requires_review:'要確認' };
    const kindLabel = { skill:'Skill', builtin_skill:'組み込みSkill', plugin_skill:'Plugin Skill', canonical_skill:'正本候補Skill', command:'command', agent:'agent', automation:'自動実行' };
    let data;
    const byId = (id) => document.getElementById(id);
    const escapeHtml = (value='') => String(value).replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
    const formatDate = (value) => new Intl.DateTimeFormat('ja-JP', { dateStyle:'medium', timeStyle:'short', timeZone:'Asia/Tokyo' }).format(new Date(value));
    const categoryName = (id) => data.categories.find((category) => category.id === id)?.name ?? id;
    const skillRecords = () => data.records.filter((record) => ['skill','builtin_skill','plugin_skill'].includes(record.kind));
    function originLabel(record) {
      if (record.legacy?.origin === '自作') return '自作';
      if (record.legacy?.origin === 'もらった' || record.legacy?.origin === 'プラグイン') return '他作';
      if (record.legacy?.origin === '公式') return '公式';
      if (record.provider.type === 'user') return '自作';
      if (record.provider.type === 'openai' || record.provider.name.includes('OpenAI')) return '公式';
      return '他作';
    }
    const originClass = (record) => ({ 自作:'origin-self', 公式:'origin-official', 他作:'origin-external' })[originLabel(record)];
    const originBadge = (record) => `<span class="origin ${originClass(record)}">${originLabel(record)}</span>`;
    const isEnvironmentMatch = (record) => !state.envs.size || [...state.envs].every((env) => record.environments[env].configured || record.environments[env].installed);
    const visibleRecords = ({ ignoreCategory = false } = {}) => skillRecords().filter((record) => {
      const searchable = [record.name,...(record.aliases || []),record.description,record.example,...(record.projectTags || []),record.provider.name].join(' ').toLocaleLowerCase('ja');
      return isEnvironmentMatch(record) && (!state.query || searchable.includes(state.query.toLocaleLowerCase('ja'))) && (ignoreCategory || !state.category || record.category === state.category) && (!state.project || record.projectTags.includes(state.project)) && (!state.provider || originLabel(record) === state.provider);
    }).sort((a,b) => data.categories.findIndex((category) => category.id === a.category) - data.categories.findIndex((category) => category.id === b.category) || a.name.localeCompare(b.name,'ja'));
    function renderOptionFilters() {
      const projects = [...new Set(skillRecords().flatMap((record) => record.projectTags))].sort((a,b) => a.localeCompare(b,'ja'));
      const providers = [...new Set(skillRecords().map(originLabel))].sort((a,b) => a.localeCompare(b,'ja'));
      byId('projectFilter').insertAdjacentHTML('beforeend', projects.map((tag) => `<option value="${escapeHtml(tag)}">案件タグ: ${escapeHtml(tag)}</option>`).join(''));
      byId('providerFilter').insertAdjacentHTML('beforeend', providers.map((provider) => `<option value="${escapeHtml(provider)}">由来: ${escapeHtml(provider)}</option>`).join(''));
    }
    function renderCategories() {
      const visible = visibleRecords({ ignoreCategory:true });
      const counts = new Map(data.categories.map((category) => [category.id,visible.filter((record) => record.category === category.id).length]));
      const buttons = [`<button class="category-button" type="button" data-category="" aria-pressed="${!state.category}"><span>すべて</span><small>${visible.length}</small></button>`];
      for (const category of data.categories) { const count = counts.get(category.id); if (!count) continue; buttons.push(`<button class="category-button" type="button" data-category="${category.id}" aria-pressed="${state.category === category.id}"><span>${escapeHtml(category.name)}</span><small>${count}</small></button>`); }
      byId('categoryList').innerHTML = buttons.join('');
      document.querySelectorAll('[data-category]').forEach((button) => button.addEventListener('click', () => { state.category = button.dataset.category; renderSkills(); }));
    }
    function environmentBadges(record) {
      return ['codex','claude'].filter((env) => record.environments[env].configured || record.environments[env].installed).map((env) => `<span class="tag">${env === 'codex' ? 'Codex' : 'Claude'} · ${availabilityLabel[record.environments[env].availability] || '要確認'}</span>`).join('') || '<span class="tag">環境 要確認</span>';
    }
    function detailRows(record) {
      const invocations = ['codex','claude'].filter((env) => record.environments[env].invocation).map((env) => `${env === 'codex' ? 'Codex' : 'Claude'}: <code>${escapeHtml(record.environments[env].invocation)}</code>`).join('<br>') || '要確認';
      const source = record.source.canonicalId ? `<code>${escapeHtml(record.source.canonicalId)}</code>` : '要確認';
      const evidence = ['codex','claude'].map((env) => record.environments[env].evidenceType && record.environments[env].evidenceType !== 'none' ? `${env === 'codex' ? 'Codex' : 'Claude'}: ${record.environments[env].evidenceType}` : '').filter(Boolean).join(' / ') || '要確認';
      const requirements = record.requirements?.length ? escapeHtml(record.requirements.join(' / ')) : '要確認';
      return `<details><summary>詳細を表示</summary><dl><dt>案件タグ</dt><dd>${record.projectTags.length ? escapeHtml(record.projectTags.join(' / ')) : '—'}</dd><dt>由来</dt><dd>${originLabel(record)}</dd><dt>提供元</dt><dd>${escapeHtml(record.provider.name)}</dd><dt>必要な連携</dt><dd>${requirements}</dd><dt>呼び出し方</dt><dd>${invocations}</dd><dt>種別</dt><dd>${kindLabel[record.kind] || record.kind}</dd><dt>棚卸し証拠</dt><dd>${escapeHtml(evidence)}</dd><dt>同期状態</dt><dd>${statusLabel[record.mirror.status]}${record.mirror.reason ? ` — ${escapeHtml(record.mirror.reason)}` : ''}</dd><dt>移行可否</dt><dd>${portabilityLabel[record.mirror.portability] || '要確認'}</dd><dt>正本ID</dt><dd>${source}</dd><dt>最終確認</dt><dd>${escapeHtml(formatDate(record.lastVerifiedAt))}</dd></dl></details>`;
    }
    function card(record) {
      const example = record.example || '依頼例は要確認です。';
      return `<article class="card"><div class="card-top"><span class="kind">${kindLabel[record.kind] || record.kind}</span><div class="card-flags"><span class="status ${record.mirror.status}">${statusLabel[record.mirror.status]}</span></div></div><h2 class="card-name">${escapeHtml(record.name)}</h2><div class="badge-row">${environmentBadges(record)}</div><p class="description">${escapeHtml(record.description)}</p><div class="example"><div><span class="example-label">依頼例</span><p class="example-text">${escapeHtml(example)}</p></div><button class="copy" type="button" data-copy="${escapeHtml(example)}">COPY</button></div><div class="card-footer"><span>${escapeHtml(categoryName(record.category))}</span></div>${detailRows(record)}</article>`;
    }
    function bindCopyButtons() {
      document.querySelectorAll('[data-copy]').forEach((button) => button.addEventListener('click', async () => {
        const text = button.dataset.copy;
        try { await navigator.clipboard.writeText(text); } catch { const area=document.createElement('textarea'); area.value=text; document.body.append(area); area.select(); document.execCommand('copy'); area.remove(); }
        const old=button.textContent; button.textContent='コピー済み'; byId('announcer').textContent='依頼例をコピーしました。'; setTimeout(() => { button.textContent=old; },1200);
      }));
    }
    function renderSkills() {
      const records = visibleRecords(); byId('resultCount').textContent=records.length; byId('tabCount').textContent=skillRecords().length;
      const label = [state.category && categoryName(state.category),state.project,state.provider,state.query && `「${state.query}」`].filter(Boolean).join(' / ');
      byId('activeFilter').hidden=!label; byId('activeFilter').textContent=label;
      byId('cardGrid').innerHTML=records.length ? records.map(card).join('') : '<div class="empty">該当するスキルがありません。条件を変えてお試しください。</div>';
      renderCategories(); bindCopyButtons();
    }
    function diffItem(record) { return `<div class="diff-item"><b>${escapeHtml(record.name)}</b><span>${escapeHtml(kindLabel[record.kind] || record.kind)} · ${escapeHtml(record.mirror.reason || statusLabel[record.mirror.status])}</span></div>`; }
    function diffPanel(title,records,empty='該当なし') { return `<section class="panel"><h3 class="panel-title">${escapeHtml(title)} <span>(${records.length})</span></h3><div class="diff-list">${records.length ? records.map(diffItem).join('') : `<p class="status-note">${empty}</p>`}</div></section>`; }
    const normalizeSkillName = (name='') => String(name).trim().toLocaleLowerCase('ja');
    function environmentIdentity(record) { return ['codex','claude'].filter((env) => record.environments[env].configured || record.environments[env].installed).map((env) => env === 'codex' ? 'Codex' : 'Claude').join(' / ') || '未配布・要確認'; }
    function identityItem(record) { return `<div class="duplicate-candidate"><b>${escapeHtml(record.name)}</b><span>${escapeHtml(kindLabel[record.kind] || record.kind)} · ${escapeHtml(environmentIdentity(record))}</span><span><span class="identity-label">提供元:</span> ${escapeHtml(record.provider.name)}</span><span><span class="identity-label">正本ID:</span> ${escapeHtml(record.source.canonicalId || '要確認')}</span></div>`; }
    function duplicatePanel(groups) { return `<section class="panel"><h3 class="panel-title">重複候補 <span>(${groups.length})</span></h3><p class="status-note">表示名が同じ候補です。自動統合・削除はしていません。</p><div class="diff-list">${groups.length ? groups.map((group) => `<div class="diff-item"><b>${escapeHtml(group.name)}</b>${group.records.map(identityItem).join('')}</div>`).join('') : '<p class="status-note">該当なし</p>'}</div></section>`; }
    function aliasPanel(records) { const aliasCount=records.reduce((total, record) => total + record.aliases.length, 0); return `<section class="panel"><h3 class="panel-title">別名統合済み <span>(${aliasCount})</span></h3><p class="status-note">検索用に統合済みの旧名・別名です。</p><div class="diff-list">${records.length ? records.map((record) => `<div class="diff-item"><b>${escapeHtml(record.name)}</b><span>${escapeHtml(record.aliases.join(' / '))}</span><span><span class="identity-label">正本ID:</span> ${escapeHtml(record.source.canonicalId || '要確認')}</span></div>`).join('') : '<p class="status-note">該当なし</p>'}</div></section>`; }
    function migrationPanel(candidates) { const byRecordId=new Map(data.records.map((record) => [record.id,record])); return `<section class="panel"><h3 class="panel-title">同一能力の移行候補 <span>(${candidates.length})</span></h3><p class="status-note">旧カードと現行Skillの対応候補です。自動統合・削除はしていません。</p><div class="diff-list">${candidates.length ? candidates.map((candidate) => `<div class="diff-item"><b>${escapeHtml(candidate.label)}</b><span>${escapeHtml(candidate.reason)}</span>${candidate.recordIds.map((id) => byRecordId.get(id)).filter(Boolean).map(identityItem).join('')}</div>`).join('') : '<p class="status-note">該当なし</p>'}</div></section>`; }
    function renderDifference() {
      const capabilityRecords = data.records.filter((record) => ['skill','builtin_skill','plugin_skill'].includes(record.kind));
      const statuses=['synced','codex_only','claude_only','not_mirrorable','needs_review']; const labels={synced:'両方で一致',codex_only:'Codexのみ',claude_only:'Claudeのみ',not_mirrorable:'ミラー不可',needs_review:'要確認'};
      byId('generatedAt').textContent=`最終棚卸し: ${formatDate(data.generatedAt)}`;
      const installedUnverified=capabilityRecords.filter((record) => ['codex','claude'].some((env) => record.environments[env].availability === 'installed_unverified')).length;
      byId('statGrid').innerHTML=[{label:'全Skill数',count:capabilityRecords.length},{label:'導入済み・実行要確認',count:installedUnverified},...statuses.map((status) => ({label:labels[status],count:capabilityRecords.filter((record) => record.mirror.status === status).length}))].map((item) => `<div class="stat"><span>${item.label}</span><b>${item.count}</b></div>`).join('');
      const hashMismatch=capabilityRecords.filter((record) => record.environments.codex.configured && record.environments.claude.configured && record.environments.codex.contentHash !== record.environments.claude.contentHash);
      const hasEnvironmentEvidence=(record) => ['codex','claude'].some((env) => record.environments[env].configured || record.environments[env].installed);
      const registeredOnly=data.records.filter((record) => record.legacy?.legacyNames?.length && !hasEnvironmentEvidence(record));
      const environmentOnly=data.records.filter((record) => !record.legacy?.legacyNames?.length && hasEnvironmentEvidence(record));
      const canonicalPending=data.records.filter((record) => record.kind === 'canonical_skill');
      const nonSkills=data.records.filter((record) => ['command','agent','automation'].includes(record.kind));
      const skillLike=data.records.filter((record) => ['skill','canonical_skill','builtin_skill','plugin_skill'].includes(record.kind));
      const duplicateMap=new Map();
      for (const record of skillLike) { const key=normalizeSkillName(record.name); duplicateMap.set(key,[...(duplicateMap.get(key) || []),record]); }
      const duplicateGroups=[...duplicateMap.values()].filter((group) => group.length > 1).map((records) => ({ name:records[0].name, records }));
      const aliasedRecords=skillLike.filter((record) => record.aliases?.length);
      const capabilityItems=(data.inventory.capabilities || []).map((item) => ({ name:item.name, kind:'連携・能力', mirror:{reason:item.reason,status:'needs_review'} }));
      byId('differenceGrid').innerHTML=[duplicatePanel(duplicateGroups),aliasPanel(aliasedRecords),migrationPanel(data.inventory.migrationCandidates || []),diffPanel('内容ハッシュ不一致',hashMismatch),diffPanel('登録済みだが実環境で未検出',registeredOnly),diffPanel('実環境で検出・旧一覧に未登録',environmentOnly),diffPanel('正本登録済み・両環境未配布・要確認',canonicalPending),diffPanel('導入証跡のみの連携・能力',capabilityItems,'該当なし'),diffPanel('ミラー不可',data.records.filter((record) => record.mirror.status === 'not_mirrorable')),diffPanel('要確認',data.records.filter((record) => record.mirror.status === 'needs_review' && record.kind !== 'canonical_skill')),diffPanel('Skill以外の種別',nonSkills,'command・agent・自動実行タスクは未検出です。')].join('');
    }
    function selectView(view) { const isSkills=view === 'skills'; byId('skillsScreen').classList.toggle('active',isSkills); byId('diffScreen').classList.toggle('active',!isSkills); byId('environmentControls').hidden=!isSkills; byId('skillsTab').setAttribute('aria-selected',String(isSkills)); byId('diffTab').setAttribute('aria-selected',String(!isSkills)); }
    async function initialise() {
      try { const response=await fetch('./data/skilldeck.json',{cache:'no-store'}); if (!response.ok) throw new Error(`データの取得に失敗しました (${response.status})`); data=await response.json(); renderOptionFilters(); renderSkills(); renderDifference(); }
      catch (error) { byId('cardGrid').innerHTML=`<div class="empty">棚卸しデータを読み込めませんでした。<br>${escapeHtml(error.message)}</div>`; }
    }
    document.querySelectorAll('[data-env]').forEach((button) => button.addEventListener('click', () => { const env=button.dataset.env; state.envs.has(env) ? state.envs.delete(env) : state.envs.add(env); button.setAttribute('aria-pressed',String(state.envs.has(env))); renderSkills(); }));
    byId('search').addEventListener('input',(event) => { state.query=event.target.value.trim(); renderSkills(); }); byId('projectFilter').addEventListener('change',(event) => { state.project=event.target.value; renderSkills(); }); byId('providerFilter').addEventListener('change',(event) => { state.provider=event.target.value; renderSkills(); });
    byId('skillsTab').addEventListener('click',() => selectView('skills')); byId('diffTab').addEventListener('click',() => selectView('diff'));
    document.querySelector('[role="tablist"]').addEventListener('keydown',(event) => { if (!['ArrowLeft','ArrowRight'].includes(event.key)) return; event.preventDefault(); const next=event.key === 'ArrowRight' ? byId('diffTab') : byId('skillsTab'); next.focus(); next.click(); });
    initialise();
  </script>
